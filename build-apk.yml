name: 构建安卓 APK

# 触发方式：
#  1) 每次推送到 main / master 分支（自动构建）
#  2) 在 GitHub 网页上手动点按钮运行（第一次建议用这个）
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-apk:
    name: 构建 APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: 1. 拉取代码
        uses: actions/checkout@v4

      - name: 2. 安装 Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 3. 安装 pnpm 9
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: 4. 安装 Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 5. 配置 Android SDK
        uses: android-actions/setup-android@v3

      - name: 6. 安装 SDK 组件（Platform / Build Tools）
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "build-tools;35.0.0"

      - name: 7. 缓存 Gradle 依赖
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('frontend/android/**/*.gradle*', 'frontend/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: 8. 安装前端依赖
        working-directory: frontend
        run: pnpm install --no-frozen-lockfile

      - name: 9. 构建网页产物并同步到安卓工程
        working-directory: frontend
        run: |
          pnpm build:app
          npx cap sync android

      - name: 10. 赋予 gradlew 执行权限
        working-directory: frontend/android
        run: chmod +x gradlew

      - name: 11. 构建 Debug APK
        working-directory: frontend/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace -I ci-mirrors.gradle

      - name: 12. 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: 我的工作台-APK
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90
          if-no-files-found: error
